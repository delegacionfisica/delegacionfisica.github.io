<svg xmlns="http://www.w3.org/2000/svg" viewBox="73 38 880 880" width="880" height="880" role="img" aria-label="Logo de la Delegación de Estudiantes de Física" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Lados del triángulo: cada mitad toma el color de su nodo, con una pequeña separación en el centro (16 uds) -->
  <g stroke-width="17" fill="none">
    <!-- Verde oscuro ↔ Azul marino -->
    <line x1="180" y1="478" x2="422.6" y2="338.5" stroke="#214D30"/>
    <line x1="436.4" y1="330.5" x2="679" y2="191" stroke="#243F6B"/>
    <!-- Azul marino ↔ Verde claro -->
    <line x1="679" y1="191" x2="679" y2="470.5" stroke="#243F6B"/>
    <line x1="679" y1="486.5" x2="679" y2="766" stroke="#70A64E"/>
    <!-- Verde claro ↔ Verde oscuro -->
    <line x1="679" y1="766" x2="436.4" y2="626" stroke="#70A64E"/>
    <line x1="422.6" y1="618" x2="180" y2="478" stroke="#214D30"/>
  </g>
  <!-- Nodos -->
  <circle cx="180" cy="478" r="100" fill="#214D30"/>
  <circle cx="180" cy="478" r="73" fill="#92AE9B"/>
  <circle cx="679" cy="191" r="100" fill="#243F6B"/>
  <circle cx="679" cy="191" r="73" fill="#929FB5"/>
  <circle cx="679" cy="766" r="100" fill="#70A64E"/>
  <circle cx="679" cy="766" r="73" fill="#B4D294"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>